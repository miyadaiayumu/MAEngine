name: DebugBuild

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  # リポジトリのルートディレクトリを基点としたソリューションファイルのパス
  SOLUTION_FILE_PATH: project/MAEngine.sln
  # Visual Studio の構成(Debug / Release)
  CONFIGURATION: Debug

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: msbuild ${{env.SOLUTION_FILE_PATH}} /p:Platform=x64 /p:Configuration=${{env.CONFIGURATION}}
