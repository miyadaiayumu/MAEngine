name: DebugBuild
on:
  push:
    branches:
      - master
      env:
      #リポジトリのルートディレクトリを基点としたソリューションファイルのパス
      SOLUTION_FILE_PATH: project/MAEngine.sln
      #Visual Studio の構成(Debug / Release)
      CONFIGURATION: Debug
      jobs: 
        build: 
          runs-on: windows-2025-vs2026

          steps: 
            - name: Checkout
              uses: actions/checkout@v2
              with: 
                msbuild-architecture: x64
                
            - name: Build
              run: |
                  msbuild ${{env.SOLUTION_FILE_PATH}}/p:Platform=x64,Configuraation=${{env.CONFIGURATION}}
