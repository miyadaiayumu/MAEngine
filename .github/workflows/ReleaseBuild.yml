name: ReleaseBuild

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: MAEngine/MAEngine.slnx
  CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild ${{env.SOLUTION_FILE_PATH}} /p:Platform=x64 /p:Configuration=${{env.CONFIGURATION}}
